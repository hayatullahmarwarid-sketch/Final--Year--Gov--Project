name: API CI

on:
  push:
    branches: [main]
    paths:
      - 'back-end/**'
      - '.github/workflows/api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'back-end/**'
      - '.github/workflows/api.yml'

permissions:
  contents: read
  packages: write

jobs:
  install:
    name: Install + verify
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: back-end

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify (no bundled tests)
        run: npm run verify

  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: install
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v5
        with:
          context: back-end
          file: back-end/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sharia-decrees-api:latest
            ghcr.io/${{ github.repository_owner }}/sharia-decrees-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
